<!doctype html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="КГУ Студент" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
    <title>КГУ Студент</title>
    <!-- Custom Cyrillic Google Fonts: Inter, Roboto, Nunito, JetBrains Mono, PT Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Auto-recovery if stale browser cache causes blank screen or 404 chunk -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Asset failed to load, auto-recovering...');
          if ('caches' in window) {
            caches.keys().then(function(names) {
              Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                window.location.reload();
              });
            });
          }
        }
      }, true);

      // Failsafe: if root element is still empty after 8 seconds, auto-heal safely (with loop protection)
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && !window.__APP_MOUNTED__) {
          var hasAttempted = sessionStorage.getItem('ksu_auto_heal_reload');
          if (!hasAttempted) {
            sessionStorage.setItem('ksu_auto_heal_reload', '1');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, 8000);
    </script>
    <script>
      // Clean up legacy broken prototype themes if present without wiping user choices
      try {
        var rawSettings = localStorage.getItem('ksu_student_settings_v2');
        if (rawSettings) {
          var parsedSettings = JSON.parse(rawSettings);
          var legacyThemes = ['cyber-violet', 'electric-mint', 'acid-lime', 'cyber'];
          if (legacyThemes.indexOf(parsedSettings.visualTheme) !== -1) {
            parsedSettings.visualTheme = 'oled';
            if (parsedSettings.accentColor === '#B5179E') {
              parsedSettings.accentColor = '#007AFF';
            }
            localStorage.setItem('ksu_student_settings_v2', JSON.stringify(parsedSettings));
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full bg-apple-gray-100 dark:bg-[#121214] text-apple-gray-900 dark:text-zinc-100 antialiased selection:bg-apple-blue selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.location.reload();
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
